# Full stack: MySQL, Redis, FastAPI, Celery worker + beat, React (nginx)
# Run from the project root that contains backend/ and frontend/:
#   docker compose up --build -d      ->  app on http://localhost:3000
name: form-builder

x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-formbuilder}:${MYSQL_PASSWORD:-formbuilder}@mysql:3306/${MYSQL_DATABASE:-form_builder}?charset=utf8mb4
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  STORAGE_DIR: /app/storage
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@formbuilder.com}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-Admin@123}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-form_builder}
      MYSQL_USER: ${MYSQL_USER:-formbuilder}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-formbuilder}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports: ["${MYSQL_HOST_PORT:-3307}:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    image: formbuilder-backend:latest
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports: ["8000:8000"]
    volumes: [storage:/app/storage]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
      start_period: 30s

  worker:
    image: formbuilder-backend:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment: { <<: *backend-env, RUN_MIGRATIONS: "false" }
    volumes: [storage:/app/storage]
    depends_on: { backend: { condition: service_healthy } }

  beat:
    image: formbuilder-backend:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment: { <<: *backend-env, RUN_MIGRATIONS: "false" }
    depends_on: { backend: { condition: service_healthy } }

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [backend]

volumes:
  mysql_data:
  storage:
