name: form-builder

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  DATABASE_URL: mysql+pymysql://${MYSQL_USER:-formbuilder}:${MYSQL_PASSWORD:-formbuilder}@mysql:3306/${MYSQL_DATABASE:-form_builder}?charset=utf8mb4
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
  STORAGE_DIR: /app/storage
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@formbuilder.com}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-Admin@123}
  FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-System Administrator}

services:
  mysql:
    image: mysql:8.0
    container_name: formbuilder-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-form_builder}
      MYSQL_USER: ${MYSQL_USER:-formbuilder}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-formbuilder}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # connect MySQL Workbench to localhost:3307
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: formbuilder-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    image: formbuilder-backend:latest
    container_name: formbuilder-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: formbuilder-backend:latest
    container_name: formbuilder-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - storage:/app/storage   # shared with backend so exports can be downloaded
    depends_on:
      backend:
        condition: service_healthy

  beat:
    image: formbuilder-backend:latest
    container_name: formbuilder-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  storage:
